version: "3.9"

# ---------------------------------------------------------------------------
# Shared network
# ---------------------------------------------------------------------------
networks:
  mplad_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  auth_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: mplad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mplad
      POSTGRES_USER:     mplad_user
      POSTGRES_PASSWORD: mplad_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro   # auto-runs on first start
    networks:
      - mplad_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplad_user -d mplad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: mplad_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://localhost:8080/api/v1
    networks:
      - mplad_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Risk Aggregator ────────────────────────────────────────────────────────
  risk-aggregator:
    build:
      context: ./services/risk-aggregator
      dockerfile: Dockerfile
    container_name: mplad_risk_aggregator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://mplad_user:mplad_secret@postgres:5432/mplad
      SERVICE_PORT: "8080"
      FINANCIAL_ENGINE_URL: http://financial-engine:8081
      IMAGE_ENGINE_URL: http://image-engine:8082
      NLP_SIMILARITY_URL: http://nlp-similarity:8085
    networks:
      - mplad_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Financial Engine ───────────────────────────────────────────────────────
  financial-engine:
    build:
      context: ./services/financial-engine
      dockerfile: Dockerfile
    container_name: mplad_financial_engine
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL:            postgresql://mplad_user:mplad_secret@postgres:5432/mplad
      COST_ESTIMATOR_URL:      http://cost-estimator:8084
      COST_ESTIMATOR_TIMEOUT_S: "5"
    networks:
      - mplad_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 60s

  # ── Image Engine ───────────────────────────────────────────────────────────
  image-engine:
    build:
      context: ./services/image-engine
      dockerfile: Dockerfile
    container_name: mplad_image_engine
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql://mplad_user:mplad_secret@postgres:5432/mplad
      SERVICE_PORT: "8082"
    networks:
      - mplad_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s

  # ── Graph Service ──────────────────────────────────────────────────────────
  graph-service:
    build:
      context: ./services/graph-service
      dockerfile: Dockerfile
    container_name: mplad_graph_service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql://mplad_user:mplad_secret@postgres:5432/mplad
      SERVICE_PORT: "8083"
    networks:
      - mplad_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Cost Estimator ─────────────────────────────────────────────────────────
  cost-estimator:
    build:
      context: ./services/cost-estimator
      dockerfile: Dockerfile
    container_name: mplad_cost_estimator
    restart: unless-stopped
    ports:
      - "8084:8084"
    networks:
      - mplad_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── NLP Similarity Service ─────────────────────────────────────────────────
  nlp-similarity:
    build:
      context: ./services/nlp-similarity
      dockerfile: Dockerfile
    container_name: mplad_nlp_similarity
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql://mplad_user:mplad_secret@postgres:5432/mplad
      SERVICE_PORT: "8085"
      MODEL_NAME: "all-MiniLM-L6-v2"
      ENCODE_BATCH_SIZE: "256"
    networks:
      - mplad_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8085/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: mplad_auth_service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      PORT:            "8086"
      NODE_ENV:        production
      JWT_SECRET:      "${JWT_SECRET}"
      JWT_EXPIRES_IN:  "2h"
      SMTP_HOST:       "${SMTP_HOST}"
      SMTP_PORT:       "${SMTP_PORT:-587}"
      SMTP_SECURE:     "${SMTP_SECURE:-false}"
      SMTP_USER:       "${SMTP_USER}"
      SMTP_PASS:       "${SMTP_PASS}"
      SMTP_FROM:       "${SMTP_FROM:-MPLADS Audit System <no-reply@mplads.gov.in>}"
      COOKIE_SECURE:   "true"
      COOKIE_SAME_SITE: "strict"
      BCRYPT_ROUNDS:   "12"
    volumes:
      - auth_data:/app/data   # persist SQLite DB across container restarts
    networks:
      - mplad_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
