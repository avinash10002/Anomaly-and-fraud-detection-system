services:
  # ───────────────────────────────────────────────────────────────────────────
  # Next.js Frontend Web Service
  # ───────────────────────────────────────────────────────────────────────────
  - type: web
    name: mplads-frontend
    runtime: node
    rootDir: services/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: mplads-risk-aggregator
          property: host
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: mplads-auth-service
          property: host

  # ───────────────────────────────────────────────────────────────────────────
  # Python Risk Aggregator Service (Central API gateway)
  # ───────────────────────────────────────────────────────────────────────────
  - type: web
    name: mplads-risk-aggregator
    runtime: python
    rootDir: services/risk-aggregator
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: mplads-postgres
          property: connectionString
      - key: FINANCIAL_ENGINE_URL
        fromService:
          type: web
          name: mplads-financial-engine
          property: host

  # ───────────────────────────────────────────────────────────────────────────
  # Python Financial Anomaly Engine
  # ───────────────────────────────────────────────────────────────────────────
  - type: web
    name: mplads-financial-engine
    runtime: python
    rootDir: services/financial-engine
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: mplads-postgres
          property: connectionString

  # ───────────────────────────────────────────────────────────────────────────
  # Node.js Official Authentication Service (OTP / JWT)
  # ───────────────────────────────────────────────────────────────────────────
  - type: web
    name: mplads-auth-service
    runtime: node
    rootDir: services/auth-service
    buildCommand: npm install
    startCommand: node src/scripts/seed.js && node src/index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "MPLADS Audit System <no-reply@mplads.gov.in>"
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "lax"

databases:
  - name: mplads-postgres
    databaseName: mplad
    user: mplad_user
    plan: free
    ipAllowList: []
